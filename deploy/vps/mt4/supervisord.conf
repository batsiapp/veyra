; Runs the virtual screen, the browser viewer, and the MT4 terminal.
; Every program restarts on exit; logs go to the container's output.

[supervisord]
nodaemon=true
user=trader
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=/usr/bin/fluxbox
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

; VNC listens inside the container only; noVNC is the one way in.
[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -localhost -rfbport 5900 -nopw -quiet
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:terminal]
command=/usr/local/bin/run-terminal.sh
priority=50
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Port 80 relay to the service's EA listener (see compose.yaml).
[program:ea-relay]
command=/usr/bin/socat TCP-LISTEN:80,fork,reuseaddr TCP:%(ENV_VEYRA_EA_UPSTREAM)s
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
